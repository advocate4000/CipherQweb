# Netlify configuration for the CipherQ marketing site.
#
# Single self-contained index.html. No build step, no bundler, no server-side
# code. The scan-request form uses Netlify Forms, which posts to this origin.

[build]
  publish = "."
  command = ""

# GET fallback only. Netlify Forms needs POST / to reach the forms handler,
# so the catch-all is restricted to GET — a blanket /* redirect would swallow
# the submission and return the page instead of recording it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Method = ["GET", "HEAD"]}

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Fonts from Google; the form posts back to this origin via Netlify Forms.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; form-action 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
