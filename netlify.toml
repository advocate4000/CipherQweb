# Netlify configuration for the CipherQ marketing site.
#
# Single self-contained index.html. No build step, no bundler, no server-side
# code. The scan-request form uses Netlify Forms, which posts to this origin.

[build]
  publish = "."
  command = ""

# NO catch-all redirect.
#
# A blanket "/* -> /index.html 200" rewrite intercepts the form POST before
# Netlify's form handler sees it, which surfaces as a 404 on submit. Netlify
# already serves index.html at / for a single-page site, so the rule bought
# nothing and cost the form. Restricting it by request method is not an option
# either — Method is not a supported redirect condition.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Fonts from Google; the form posts back to this origin via Netlify Forms.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; form-action 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
